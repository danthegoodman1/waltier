name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flags:
          - --all-features
          - --no-default-features
          - --no-default-features --features s3
          - --no-default-features --features sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked ${{ matrix.flags }}
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features --example group_commit
      - run: cargo test --locked --release --all-features --lib image::tests
      - run: cargo test --locked --release --all-features --test limits --test outcomes
      - name: Expanded deterministic corpus
        env:
          DST_SEEDS: 80
          DST_STEPS: 400
          ORACLE_SEEDS: 48
          ORACLE_STEPS: 400
        run: cargo test --locked --all-features --test dst --test concurrency
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --all-features --all-targets
