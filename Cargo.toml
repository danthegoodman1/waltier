[package]
name = "waltier"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "A tiered write-ahead log: memory, local disk, and S3, with etag-CAS fencing and user-defined compaction."
license = "MIT"
repository = "https://github.com/danthegoodman1/waltier"
readme = "README.md"
keywords = ["wal", "s3", "log", "storage", "compaction"]
categories = ["database-implementations", "data-structures"]

[features]
default = ["s3", "sim"]
s3 = ["dep:rusty-s3", "dep:ureq", "dep:url"]
# Simulation support (waltier::sim): deterministic RNG, fault/latency
# injection. Used by the DST suite and benchmarks; useful for testing apps
# built on WalTier.
sim = []

[dependencies]
getrandom = "0.4"
thiserror = "2"
rusty-s3 = { version = "0.5", optional = true }
ureq = { version = "2", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "group_commit"
required-features = ["sim"]

[[bench]]
name = "wal"
harness = false
required-features = ["sim"]

[[bench]]
name = "review"
harness = false
required-features = ["sim"]

[[bench]]
name = "resources"
harness = false
required-features = ["sim"]

[[bench]]
name = "cache"
harness = false
